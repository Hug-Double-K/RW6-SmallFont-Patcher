name: Build RW6 apps (Noti + Memo, phone apk + watch rpk)

on:
  push:
    branches: [main]
    paths:
      - 'noti/android/**'
      - 'noti/watch/**'
      - 'noti/sign/**'
      - 'memo/android/**'
      - 'memo/watch/**'
      - 'ai/android/**'
      - 'ai/watch/**'
      - 'hub/android/**'
      - '.github/workflows/build-noti.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 폰 앱 (.apk) ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build apk
        working-directory: noti/android
        run: gradle --no-daemon assembleRelease 2>&1 | tee ../../build-android.log

      # ---------- 워치 앱 (.rpk) ----------
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build rpk
        working-directory: noti/watch
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -20
          npx aiot release 2>&1 | tee ../../build-watch.log
          ls -la dist || true

      # ---------- RW6 메모 ----------
      - name: Build memo apk
        working-directory: memo/android
        run: gradle --no-daemon assembleRelease 2>&1 | tee ../../build-memo-android.log
      - name: Build memo rpk
        working-directory: memo/watch
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -20
          npx aiot release 2>&1 | tee ../../build-memo-watch.log

      # ---------- RW6 AI 시험 ----------
      - name: Build ai apk
        if: always()
        working-directory: ai/android
        run: gradle --no-daemon assembleRelease 2>&1 | tee ../../build-ai-android.log
      - name: Build ai rpk
        if: always()
        working-directory: ai/watch
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -20
          npx aiot release 2>&1 | tee ../../build-ai-watch.log

      # ---------- Mi Manager (가칭, Mi Fitness 대체) ----------
      - name: Build hub apk
        if: always()
        working-directory: hub/android
        run: gradle --no-daemon assembleRelease 2>&1 | tee ../../build-hub-android.log

      # ---------- 결과물을 저장소에 올림 ----------
      - name: Commit outputs
        if: always()
        run: |
          mkdir -p noti/release
          cp noti/android/app/build/outputs/apk/release/*.apk noti/release/RW6Noti.apk 2>/dev/null || true
          cp noti/watch/dist/*.rpk noti/release/RW6Noti.rpk 2>/dev/null || true
          tail -60 build-android.log > noti/release/build-android.log 2>/dev/null || true
          tail -60 build-watch.log > noti/release/build-watch.log 2>/dev/null || true
          mkdir -p memo/release
          cp memo/android/app/build/outputs/apk/release/*.apk memo/release/RW6Memo.apk 2>/dev/null || true
          cp memo/watch/dist/*.rpk memo/release/RW6Memo.rpk 2>/dev/null || true
          tail -60 build-memo-android.log > memo/release/build-android.log 2>/dev/null || true
          tail -60 build-memo-watch.log > memo/release/build-watch.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ai/release
          cp ai/android/app/build/outputs/apk/release/*.apk ai/release/RW6AI.apk 2>/dev/null || true
          cp ai/watch/dist/*.rpk ai/release/RW6AI.rpk 2>/dev/null || true
          tail -60 build-ai-android.log > ai/release/build-android.log 2>/dev/null || true
          tail -60 build-ai-watch.log > ai/release/build-watch.log 2>/dev/null || true
          mkdir -p hub/release
          cp hub/android/app/build/outputs/apk/release/*.apk hub/release/MiManager.apk 2>/dev/null || true
          tail -60 build-hub-android.log > hub/release/build-android.log 2>/dev/null || true
          git add noti/release memo/release ai/release hub/release
          git commit -m "Build outputs ${GITHUB_SHA::7} [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push

name: Build RW6 Noti (phone apk + watch rpk)

on:
  push:
    branches: [main]
    paths:
      - 'noti/android/**'
      - 'noti/watch/**'
      - 'noti/sign/**'
      - '.github/workflows/build-noti.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 폰 앱 (.apk) ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build apk
        working-directory: noti/android
        run: gradle --no-daemon assembleRelease 2>&1 | tee ../../build-android.log

      # ---------- 워치 앱 (.rpk) ----------
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build rpk
        working-directory: noti/watch
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -20
          npx aiot release 2>&1 | tee ../../build-watch.log
          ls -la dist || true

      # ---------- 결과물을 저장소에 올림 ----------
      - name: Commit outputs
        if: always()
        run: |
          mkdir -p noti/release
          cp noti/android/app/build/outputs/apk/release/*.apk noti/release/RW6Noti.apk 2>/dev/null || true
          cp noti/watch/dist/*.rpk noti/release/RW6Noti.rpk 2>/dev/null || true
          tail -60 build-android.log > noti/release/build-android.log 2>/dev/null || true
          tail -60 build-watch.log > noti/release/build-watch.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noti/release
          git commit -m "Build outputs ${GITHUB_SHA::7} [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push

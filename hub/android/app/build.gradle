plugins {
    id 'com.android.application'
}

def ksProps = new Properties()
ksProps.load(new FileInputStream(rootProject.file("../../noti/sign/keystore.properties")))

android {
    namespace 'io.github.hugdoublek.rw6hub'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.hugdoublek.rw6hub"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.3"
    }

    signingConfigs {
        release {
            storeFile rootProject.file("../../noti/sign/rw6noti.jks")
            storePassword ksProps['storePassword']
            keyAlias ksProps['keyAlias']
            keyPassword ksProps['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
